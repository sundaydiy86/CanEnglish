  <script>
    // ==========================================
    // 系統常數與全域狀態
    // ==========================================
    const TARGET_RTDB_URL = "https://caneng-a8157-default-rtdb.firebaseio.com";
    
    // 初始化獨立 User ID (匿名使用)
    let sessionUserId = localStorage.getItem('caneng_user_id');
    if (!sessionUserId) {
      sessionUserId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('caneng_user_id', sessionUserId);
    }

    let currentWordItem = null;
    let vocabList = [];
    let currentQuizItem = null;
    let quizStreak = 0;
    let activeFilter = 'all';
    window.currentUtterance = null;
    window.currentActiveExamples = [];

    // ==========================================
    // 核心 UI 輔助函式 (Toast & Indicator)
    // ==========================================
    function showToast(message) {
      const toast = document.getElementById('toast-box');
      const toastMsg = document.getElementById('toast-message');
      if (!toast || !toastMsg) return;
      
      toastMsg.innerText = message;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      
      if (window.toastTimer) clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }

    function updateSyncIndicator(status, text) {
      const dot = document.getElementById('sync-dot');
      const textEl = document.getElementById('sync-text');
      if (!dot || !textEl) return;
      
      if (status === 'syncing') {
        dot.className = 'w-2 h-2 rounded-full bg-amber-400 animate-pulse';
      } else if (status === 'error') {
        dot.className = 'w-2 h-2 rounded-full bg-rose-500';
      } else {
        dot.className = 'w-2 h-2 rounded-full bg-emerald-500';
      }
      if (text) textEl.innerText = text;
    }

    // ==========================================
    // 權威字典資料庫
    // ==========================================
    const masterDictionary = {
      'span': {
        word: 'span',
        phonetic: '/spæn/',
        pos: 'noun 名詞 / verb 動詞',
        chineseMeaning: '跨度、跨越、持續時間',
        chineseUsage: '作為名詞指時間跨度（如 attention span 專注力期間）或空間跨距；動詞指「橫跨空間、持續長達多長時間」。',
        breakdown: [
          { word: 'span', pos: 'root 詞根', meaning: '跨距、跨越', explanation: '本義為手掌張開所量度之距離，引申為涵蓋範圍。' }
        ],
        examples: [
          { tag: '現代科技', en: 'Prolonged exposure to short-form video feeds can noticeably reduce your attention span.', zh: '長時間觀看短影音動態會顯著縮短個人的專注力持續時間。' },
          { tag: '歷史時事', en: 'His diplomatic career spanned over four decades of turbulent global political shifts.', zh: '他的外交生涯跨越了四十多年動盪起伏的全球政治變局。' }
        ],
        synonyms: ['extent', 'duration', 'period', 'stretch', 'scope'],
        antonyms: [],
        cantoneseMnemonic: {
          pun: '粵音「西便（西邊）」',
          story: '由東邊一路跨越到「西便」，成座大橋跨度好長，時間更跨越咗大半個世紀！',
          visualCue: '想像一座宏偉長橋由東岸直跨到西便（西邊），橫跨兩岸海峽。'
        }
      },
      'outperform': {
        word: 'outperform',
        phonetic: '/ˌaʊtpəˈfɔːm/',
        pos: 'verb 動詞',
        chineseMeaning: '跑贏大盤、表現優於、大幅勝過',
        chineseUsage: '廣泛應用於金融財經、商業競爭與體育競技，指某資產、企業或個人表現超越指標基準。',

    // ==========================================
    // 雲端與本地記憶持久化 (永久儲存)
    // ==========================================
    function saveLocally() {
      try {
        localStorage.setItem('caneng_vocabularies', JSON.stringify(vocabList));
      } catch (e) {}
    }

    async function saveToCloudSafely(item) {
      saveLocally();
      updateSyncIndicator('syncing', "雲端同步中...");
      try {
        const cleanId = (item.id || ('v_' + Date.now())).replace(/[.$#[\]/]/g, '_');
        await fetch(`${TARGET_RTDB_URL}/users/${sessionUserId}/vocabularies/${cleanId}.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(item)
        });
        updateSyncIndicator('synced', `已永久記憶 ${vocabList.length} 詞`);
      } catch (err) {
        updateSyncIndicator('error', `已本地記憶 ${vocabList.length} 詞`);
      }
    }

    async function loadCloudVocabulary() {
      // 1. 先從本地讀取
      try {
        const cached = localStorage.getItem('caneng_vocabularies');
        if (cached) {
          vocabList = JSON.parse(cached);
        }
      } catch (e) {}

      // 2. 從 Firebase 讀取最新狀態
      try {
        const res = await fetch(`${TARGET_RTDB_URL}/users/${sessionUserId}/vocabularies.json`);
        if (res.ok) {
          const data = await res.json();
          if (data && typeof data === 'object') {
            const cloudItems = Object.values(data).filter(Boolean);
            if (cloudItems.length > 0) {
              const map = new Map();
              // 以字詞為 key，確保不重複
              cloudItems.forEach(i => map.set(i.word.toLowerCase(), i));
              vocabList.forEach(i => map.set(i.word.toLowerCase(), i));
              // 按照 timestamp 降冪排序 (最新的在最前)
              vocabList = Array.from(map.values()).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
              saveLocally();
            }
          }
        }
      } catch (e) {
        console.error("Firebase 讀取失敗，使用本地快取", e);
      }
      
      updateSyncIndicator('synced', `已永久記憶 ${vocabList.length} 詞`);
      renderWordbookList();
      
      if (vocabList.length > 0 && !currentWordItem) {
        renderVocabCard(vocabList[0]); // 顯示最新查的單字
      } else if (vocabList.length === 0) {
        renderVocabCard(masterDictionary['outperform']);
      }
    }

    // ==========================================
    // 核心雙引擎 API (翻譯、例句、語義)
    // ==========================================
    async function fetchRealChineseTranslation(text) {
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&dt=bd&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          let translated = '';
          if (data && data[0]) translated = data[0].map(s => s[0]).join('');
          
          let detailedPos = '';
          if (data && data[1] && Array.isArray(data[1])) {
            const posList = data[1].map(entry => {
              const posName = entry[0];
              const terms = (entry[1] || []).slice(0, 3).join('、');
              return `[${posName}] ${terms}`;
            });
            detailedPos = posList.join('； ');
          }
          return { meaning: translated || text, detailedPos: detailedPos || `實用詞彙釋義` };
        }
      } catch (e) {}
      return { meaning: text, detailedPos: '現代英語實用語義' };
    }

    // Datamuse 語義網絡
    async function fetchDatamuseSemantics(word) {
      let synonyms = [];
      let antonyms = [];
      try {
        const [synRes, antRes] = await Promise.all([
          fetch(`https://api.datamuse.com/words?rel_syn=${encodeURIComponent(word)}&max=5`),
          fetch(`https://api.datamuse.com/words?rel_ant=${encodeURIComponent(word)}&max=4`)
        ]);
        if (synRes.ok) {
          const synData = await synRes.json();
          synonyms = synData.map(item => item.word);
        }
        if (antRes.ok) {
          const antData = await antRes.json();
          antonyms = antData.map(item => item.word);
        }
      } catch (e) {}
      
      return { synonyms, antonyms };
    }

    async function fetchAuthenticExamples(word, chineseMeaning) {
      let rawSentences = [];
      try {
        const dictRes = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
        if (dictRes.ok) {
          const dictData = await dictRes.json();
          if (Array.isArray(dictData)) {
            for (const entry of dictData) {
              if (entry.meanings) {
                for (const m of entry.meanings) {
                  if (m.definitions) {
                    for (const def of m.definitions) {
                      if (def.example && def.example.trim().length > 10) {
                        const cleanEx = def.example.trim();
                        if (!rawSentences.includes(cleanEx)) rawSentences.push(cleanEx);
                        if (rawSentences.length >= 2) break;
                      }
                    }
                  }
                  if (rawSentences.length >= 2) break;
                }
              }
              if (rawSentences.length >= 2) break;
            }
          }
        }
      } catch (e) {}

      // 如果 Dictionary API 找不到例句，提供有意義的備用例句 (避免模版)
      if (rawSentences.length === 0) {
         rawSentences.push(`It is crucial to understand how to use the word "${word}" in daily conversations.`);
         rawSentences.push(`The speaker used "${word}" to emphasize a specific point during the presentation.`);
      } else if (rawSentences.length === 1) {
         rawSentences.push(`Learning the context of "${word}" helps improve your vocabulary.`);
      }

      const results = [];
      const tags = ['生活與職場情境', '時事與日常表達'];
      for (let i = 0; i < 2; i++) {
        const enSentence = rawSentences[i];
        const zhResult = await fetchRealChineseTranslation(enSentence);
        results.push({ tag: tags[i], en: enSentence, zh: zhResult.meaning });
      }
      return results;
    }

    function generateCantoneseMnemonic(word, meaning) {
      const w = word.toLowerCase().trim();
      const soundMap = {
        'pass': '「趴士 / 怕死」',
        'span': '「西便」',
        'out': '「坳」',
        'per': '「破」',
        'form': '「風」',
        'pro': '「破」',
        'cras': '「卡」',
        'ti': '「梯」',
        'nate': '「泥」',
        're': '「利」',
        'luc': '「碌」',
        'tant': '「藤」',
        'con': '「看」',
        'sti': '「死梯」',
        'tute': '「跳」'
      };

      let sound = '「粵音聯想」';
      for (const [key, val] of Object.entries(soundMap)) {
        if (w.includes(key)) {
          sound = `粵音似${val}`;
          break;
        }
      }

      return {
        pun: sound,
        story: `讀音近似廣東話${sound}，用熟悉嘅母語口訣連結，將「${meaning.slice(0, 10)}」牢牢印在記憶深處！`,
        visualCue: `腦海中想像一個與「${meaning.slice(0, 10)}」息息相關、生動鮮明的畫面。`
      };
    }

    async function searchWord(queryWord) {
      const q = queryWord.trim().toLowerCase();
      if (!q) return;

      const existing = vocabList.find(i => i.word.toLowerCase() === q);
      if (existing) {
        // 更新 timestamp 讓它排在最前面
        existing.timestamp = Date.now();
        
        // 清理可能殘留的舊廢話快取
        if (existing.chineseUsage === `常用於現代英語口語交流與新聞語境，表達「${existing.word}」相關核心概念。`) {
           existing.chineseUsage = `實用詞彙釋義`;
        }

        saveToCloudSafely(existing);
        // 將更新的單字移到陣列最前面
        vocabList = vocabList.filter(i => i.id !== existing.id);
        vocabList.unshift(existing);

        renderVocabCard(existing);
        renderWordbookList();
        showToast(`已載入「${q}」`);
        return;
      }

      if (masterDictionary[q]) {
        const item = masterDictionary[q];
        const now = Date.now();
        const newEntry = {
          id: 'v_' + now,
          ...item,
          favorite: false,
          isCustomSearch: true,
          timestamp: now
        };
        vocabList.unshift(newEntry);
        saveToCloudSafely(newEntry);
        renderVocabCard(newEntry);
        renderWordbookList();
        showToast(`成功查得「${item.word}」，已永久記憶`);
        return;
      }

      showToast(`正在深度檢索「${q}」中文釋義與真實例句...`);
      updateSyncIndicator('syncing', `檢索 ${q}...`);

      const [transResult, semantics] = await Promise.all([
        fetchRealChineseTranslation(q),
        fetchDatamuseSemantics(q)
      ]);
      const authenticExamples = await fetchAuthenticExamples(q, transResult.meaning);
      const mnemonic = generateCantoneseMnemonic(q, transResult.meaning);
      const now = Date.now();

      const generatedEntry = {
        id: 'v_' + now,
        word: queryWord.trim(),
        phonetic: `/${q}/`,
        pos: q.includes(' ') ? 'phrase 片語' : 'word 詞彙',
        chineseMeaning: transResult.meaning,
        chineseUsage: transResult.detailedPos || `實用詞彙釋義`,
        breakdown: [],
        examples: authenticExamples,
        synonyms: semantics.synonyms,
        antonyms: semantics.antonyms,
        cantoneseMnemonic: mnemonic,
        favorite: false,
        isCustomSearch: true,
        timestamp: now
      };

      vocabList.unshift(generatedEntry);
      saveToCloudSafely(generatedEntry);
      renderVocabCard(generatedEntry);
      renderWordbookList();
      showToast(`已成功永久收錄「${queryWord.trim()}」！`);
    }

    // ==========================================
    // 語音引擎
    // ==========================================
    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        // 關鍵：將引號與破折號全部轉為空格，杜絕 HTML 與 JS 語法衝突崩潰
        const cleanText = text.replace(/["'“”‘’\-]/g, ' ').trim();
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'en-US';
        utterance.rate = 0.88; 
        window.currentUtterance = utterance; 
        utterance.onend = () => { window.currentUtterance = null; };
        window.speechSynthesis.speak(utterance);
      } catch (err) {}
    }

    function playExampleAudio(index) {
      if (window.currentActiveExamples && window.currentActiveExamples[index]) {
        const sentence = window.currentActiveExamples[index].en;
        speakText(sentence);
        showToast(`🔊 正在朗讀第 ${index + 1} 句...`);
      }
    }

              <span class="text-[10px] text-gray-400">建立對比連結</span>
            </div>
            <div class="space-y-1.5">
              <div class="flex items-center space-x-2">
                <span class="text-[10px] px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-800 font-bold shrink-0">同義</span>
                <div class="flex flex-wrap gap-1.5 items-center min-h-[24px]">${synonymsHTML}</div>
              </div>
              <div class="flex items-center space-x-2">
                <span class="text-[10px] px-2 py-0.5 rounded-md bg-rose-100 text-rose-800 font-bold shrink-0">反義</span>
                <div class="flex flex-wrap gap-1.5 items-center min-h-[24px]">${antonymsHTML}</div>
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById('card-fav-btn').addEventListener('click', () => {
        item.favorite = !item.favorite;
        saveToCloudSafely(item);
        renderVocabCard(item);
        renderWordbookList();
        showToast(item.favorite ? `已收藏「${item.word}」` : `已取消收藏「${item.word}」`);
      });
    }

    function renderWordbookList() {
      const container = document.getElementById('wordbook-list');
      const badge = document.getElementById('wordbook-count-badge');
      if (badge) badge.innerText = `${vocabList.length} 詞`;

      let filtered = vocabList;
      if (activeFilter === 'fav') filtered = vocabList.filter(item => item.favorite);
      else if (activeFilter === 'searched') filtered = vocabList.filter(item => item.isCustomSearch);

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-3xl p-8 text-center shadow-ios border border-gray-100 space-y-2">
            <i class="ph-bold ph-bookmark-simple text-gray-300 text-3xl"></i>
            <h4 class="text-sm font-bold text-gray-800">生字庫空空如也</h4>
            <p class="text-xs text-gray-400">查閱過的單字會自動累積在這裡，並享有永久記憶！</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div class="bg-white rounded-2xl p-3.5 shadow-ios border border-gray-100 flex items-center justify-between active:bg-gray-50 transition-all">
          <div class="space-y-1 flex-1 pr-3 cursor-pointer" onclick="selectWordFromList('${item.word}')">
            <div class="flex items-center space-x-2">
              <span class="font-extrabold text-sm text-gray-900">${item.word}</span>
              <span class="text-[10px] px-1.5 py-0.2 rounded bg-gray-100 text-gray-600 font-medium">${item.pos || '詞'}</span>
              ${item.favorite ? '<i class="ph-fill ph-star text-amber-500 text-xs"></i>' : ''}
            </div>
            <p class="text-xs font-bold text-iosBlue truncate">${item.chineseMeaning}</p>
            <div class="flex items-center space-x-2 text-[10px] text-gray-400 font-medium">
              <span class="text-emerald-600 font-semibold">已永久保存</span>
            </div>
          </div>
          <div class="flex items-center space-x-1">
            <button onclick="speakText('${item.word.replace(/'/g, "\\'")}')" class="w-8 h-8 rounded-xl bg-gray-50 text-gray-600 flex items-center justify-center hover:bg-gray-100"><i class="ph-bold ph-speaker-high text-xs"></i></button>
            <button onclick="deleteSingleWord('${item.id}')" class="w-8 h-8 rounded-xl bg-gray-50 text-rose-500 flex items-center justify-center hover:bg-rose-50"><i class="ph-bold ph-trash text-xs"></i></button>
          </div>
        </div>
      `).join('');
    }

    function selectWordFromList(word) {
      const found = vocabList.find(i => i.word.toLowerCase() === word.toLowerCase());
      if (found) {
        renderVocabCard(found);
        switchTab('search');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function deleteSingleWord(id) {
      const idx = vocabList.findIndex(i => i.id === id);
      if (idx !== -1) {
        const removed = vocabList.splice(idx, 1)[0];
        saveLocally();
        renderWordbookList();
        showToast(`已移除「${removed.word}」`);
        const cleanId = (removed.id || '').replace(/[.$#[\]/]/g, '_');
        fetch(`${TARGET_RTDB_URL}/users/${sessionUserId}/vocabularies/${cleanId}.json`, { method: 'DELETE' }).catch(() => {});
        updateSyncIndicator('synced', `已永久記憶 ${vocabList.length} 詞`);
      }
    }

    // ==========================================
    // 測驗生成器
    // ==========================================
    function generateAssociativeQuiz() {
      const quizBox = document.getElementById('quiz-content-box');
      if (vocabList.length === 0) {
        quizBox.innerHTML = `<div class="py-8 text-center space-y-2"><i class="ph-bold ph-lightbulb text-amber-500 text-3xl"></i><h4 class="text-sm font-bold text-gray-900">暫無測驗題目</h4><p class="text-xs text-gray-500">請先查閱或收錄至少 1 個單字</p></div>`;
        return;
      }

      // 隨機選一個單字
      const target = vocabList[Math.floor(Math.random() * vocabList.length)];
      
      const validAnts = (target.antonyms || []).filter(a => a && a !== 'contrast term' && a !== 'opposite term');
      const validSyns = (target.synonyms || []).filter(s => s && s !== 'related term' && s !== 'core concept' && s !== target.word);

      const hasAntonyms = validAnts.length > 0;
      const hasSynonyms = validSyns.length > 0;

      if (!hasAntonyms && !hasSynonyms) {
        // 如果選中的單字沒有同反義詞，提示並允許用戶跳過
        quizBox.innerHTML = `
          <div class="py-8 text-center space-y-3">
            <i class="ph-bold ph-info text-blue-500 text-3xl"></i>
            <div>
              <h4 class="text-sm font-bold text-gray-900">「${target.word}」無關聯詞彙</h4>
              <p class="text-xs text-gray-500 mt-1">這個單字目前沒有直接的同義或反義詞。</p>
            </div>
            <button onclick="generateAssociativeQuiz()" class="px-4 py-2 bg-blue-50 text-iosBlue font-bold rounded-xl text-xs active:bg-blue-100">換一題試試</button>
          </div>`;
        return;
      }

      const isAntonymQuestion = hasAntonyms && (Math.random() > 0.5 || !hasSynonyms);
      const questionType = isAntonymQuestion ? '反義詞' : '同義詞';
      const correctAnswer = isAntonymQuestion 
        ? validAnts[Math.floor(Math.random() * validAnts.length)]
        : validSyns[Math.floor(Math.random() * validSyns.length)];

      const distractorPool = ['instant', 'advance', 'delay', 'surpass', 'hesitant', 'calm', 'rapid', 'fragile', 'diminish', 'boost', 'expand', 'shrink'];
      const wrongOptions = distractorPool.filter(w => w !== correctAnswer).sort(() => 0.5 - Math.random()).slice(0, 3);
      const allOptions = [correctAnswer, ...wrongOptions].sort(() => 0.5 - Math.random());

      currentQuizItem = { word: target.word, type: questionType, correctAnswer: correctAnswer };

      quizBox.innerHTML = `
        <div class="space-y-4">
          <div class="p-4 bg-gray-50 rounded-2xl border border-gray-100 text-center space-y-1 relative">
             <button onclick="generateAssociativeQuiz()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600"><i class="ph-bold ph-arrows-clockwise"></i></button>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${isAntonymQuestion ? 'bg-rose-50 text-rose-700 border border-rose-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}">找出正確的【${questionType}】</span>
            <h3 class="text-2xl font-black text-gray-950">${target.word}</h3>
            <p class="text-xs text-iosBlue font-bold">${target.chineseMeaning}</p>
          </div>
          <div class="grid grid-cols-2 gap-2.5">
            ${allOptions.map(opt => `<button onclick="handleQuizAnswer('${opt}')" class="quiz-option-btn p-3 bg-white border border-gray-200 rounded-2xl text-xs font-bold text-gray-800 shadow-2xs hover:border-iosBlue active:bg-blue-50 transition-all text-center">${opt}</button>`).join('')}
          </div>
        </div>
      `;
    }

    function handleQuizAnswer(selected) {
      if (!currentQuizItem) return;
      if (selected === currentQuizItem.correctAnswer) {
        quizStreak++;
        document.getElementById('quiz-score').innerText = `${quizStreak} 連勝`;
        showToast(`答對了！「${selected}」正是正確答案！🎉`);
        setTimeout(() => generateAssociativeQuiz(), 1000);
      } else {
        quizStreak = 0;
        document.getElementById('quiz-score').innerText = `0 連勝`;
        showToast(`哎呀！正確答案應該是「${currentQuizItem.correctAnswer}」哦！`);
      }
    }

    function switchTab(tabId) {
      ['search', 'quiz', 'wordbook'].forEach(id => {
        document.getElementById(`tab-${id}-view`).classList.add('hidden');
        document.getElementById(`nav-btn-${id}`).className = "flex flex-col items-center space-y-0.5 text-gray-400 transition-colors";
      });
      document.getElementById(`tab-${tabId}-view`).classList.remove('hidden');
      document.getElementById(`nav-btn-${tabId}`).className = "flex flex-col items-center space-y-0.5 text-iosBlue transition-colors";
      
      if (tabId === 'quiz') generateAssociativeQuiz();
      if (tabId === 'wordbook') renderWordbookList();
    }

    // ==========================================
    // 啟動與事件綁定
    // ==========================================
    function initApp() {
      // 顯示 User ID
      document.getElementById('user-id-display').innerText = sessionUserId;
      loadCloudVocabulary();

      // Tab 切換
      document.getElementById('nav-btn-search').addEventListener('click', () => switchTab('search'));
      document.getElementById('nav-btn-quiz').addEventListener('click', () => switchTab('quiz'));
      document.getElementById('nav-btn-wordbook').addEventListener('click', () => switchTab('wordbook'));

      // 搜尋事件
      const searchInput = document.getElementById('search-input');
      const submitBtn = document.getElementById('submit-search-btn');
      const clearBtn = document.getElementById('clear-search-btn');

      searchInput.addEventListener('input', (e) => clearBtn.classList.toggle('hidden', !e.target.value));
      clearBtn.addEventListener('click', () => { searchInput.value = ''; clearBtn.classList.add('hidden'); searchInput.focus(); });
      submitBtn.addEventListener('click', () => { const val = searchInput.value.trim(); if (val) searchWord(val); });
      searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { const val = searchInput.value.trim(); if (val) searchWord(val); searchInput.blur(); } });

      document.querySelectorAll('.quick-word-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          searchInput.value = btn.getAttribute('data-word');
          clearBtn.classList.remove('hidden');
          searchWord(searchInput.value);
        });
      });

      // 篩選
      const updateFilterBtnStyles = () => {
        ['all', 'fav', 'searched'].forEach(f => {
          document.getElementById(`filter-${f}-btn`).className = "px-3 py-1 bg-white border border-gray-200 text-gray-600 font-medium rounded-xl active:bg-gray-50";
        });
        document.getElementById(`filter-${activeFilter}-btn`).className = "px-3 py-1 bg-iosBlue text-white font-bold rounded-xl shadow-xs";
      };
      
      ['all', 'fav', 'searched'].forEach(f => {
        document.getElementById(`filter-${f}-btn`).addEventListener('click', () => {
          activeFilter = f;
          updateFilterBtnStyles();
          renderWordbookList();
        });
      });

      // 清空資料對話框
      const confirmDialog = document.getElementById('confirm-dialog-modal');
      document.getElementById('clear-all-words-btn').addEventListener('click', () => {
        if (vocabList.length === 0) { showToast("生字庫已經是空的！"); return; }
        confirmDialog.style.display = 'flex';
      });
      document.getElementById('dialog-cancel-btn').addEventListener('click', () => confirmDialog.style.display = 'none');
      document.getElementById('dialog-confirm-btn').addEventListener('click', () => {
        const toDelete = [...vocabList];
        vocabList = [];
        saveLocally();
        renderVocabCard(masterDictionary['outperform']);
        renderWordbookList();
        confirmDialog.style.display = 'none';
        showToast("已成功清空所有生字！");
        updateSyncIndicator('synced', "生字庫已清空");
        if (TARGET_RTDB_URL) {
          toDelete.forEach(item => {
            const cleanId = (item.id || '').replace(/[.$#[\]/]/g, '_');
            fetch(`${TARGET_RTDB_URL}/users/${sessionUserId}/vocabularies/${cleanId}.json`, { method: 'DELETE' }).catch(() => {});
          });
        }
      });

      // 手動新增 Modal
      const addModal = document.getElementById('add-modal');
      document.getElementById('add-word-btn').addEventListener('click', () => addModal.style.display = 'flex');
      document.getElementById('close-modal-btn').addEventListener('click', () => addModal.style.display = 'none');
      document.getElementById('cancel-add-btn').addEventListener('click', () => addModal.style.display = 'none');
      
      document.getElementById('confirm-add-btn').addEventListener('click', () => {
        const word = document.getElementById('input-new-word').value.trim();
        const meaning = document.getElementById('input-new-meaning').value.trim();
        const pun = document.getElementById('input-new-pun').value.trim();
        const syns = document.getElementById('input-new-syn').value.split(',').map(s=>s.trim()).filter(Boolean);
        const ants = document.getElementById('input-new-ant').value.split(',').map(s=>s.trim()).filter(Boolean);

        if(!word || !meaning) {
          showToast("請填寫單字與意思！");
          return;
        }

        const now = Date.now();
        const newItem = {
          id: 'v_' + now,
          word: word,
          chineseMeaning: meaning,
          chineseUsage: "使用者手動收錄",
          cantoneseMnemonic: { pun: pun || '自訂口訣', story: '', visualCue: '' },
          synonyms: syns,
          antonyms: ants,
          favorite: false,
          isCustomSearch: true,
          timestamp: now
        };

        vocabList.unshift(newItem);
        saveToCloudSafely(newItem);
        renderVocabCard(newItem);
        renderWordbookList();
        
        addModal.style.display = 'none';
        document.getElementById('input-new-word').value = '';
        document.getElementById('input-new-meaning').value = '';
        document.getElementById('input-new-pun').value = '';
        document.getElementById('input-new-syn').value = '';
        document.getElementById('input-new-ant').value = '';
        showToast("收錄成功！");
      });

      // 雲端診斷 Modal
      const cloudModal = document.getElementById('cloud-modal');
      document.getElementById('ai-status-indicator').addEventListener('click', () => cloudModal.style.display = 'flex');
      document.getElementById('close-cloud-modal-btn').addEventListener('click', () => cloudModal.style.display = 'none');
      document.getElementById('close-cloud-btn').addEventListener('click', () => cloudModal.style.display = 'none');

      // 點擊背景關閉 Modal
      [addModal, confirmDialog, cloudModal].forEach(m => {
        m.addEventListener('click', (e) => { if (e.target === m) m.style.display = 'none'; });
      });

      // 一鍵診斷按鈕
      document.getElementById('test-connection-btn').addEventListener('click', async () => {
        const btn = document.getElementById('test-connection-btn');
        const box = document.getElementById('diagnostic-result-box');
        const badge = document.getElementById('diagnostic-badge');
        
        btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i><span>診斷中...</span>';
        box.classList.remove('hidden');
        box.className = 'mt-2 p-2.5 rounded-xl text-[11px] leading-relaxed font-medium bg-gray-100 text-gray-700 block';
        box.innerHTML = '正在連接至 Firebase RTDB...';
        
        try {
          const testRef = `${TARGET_RTDB_URL}/ping_test/${sessionUserId}.json`;
          const res = await fetch(testRef, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ timestamp: Date.now() })
          });
          
          if (res.ok) {
            badge.className = "px-2 py-0.5 rounded-md text-[10px] font-bold bg-emerald-100 text-emerald-700";
            badge.innerText = "連線正常";
            box.className = 'mt-2 p-2.5 rounded-xl text-[11px] leading-relaxed font-medium bg-emerald-50 text-emerald-800 border border-emerald-200 block';
            box.innerHTML = '✅ <b>連線成功！</b><br>已確認你對資料庫有完整的讀寫權限，生字會正常永久同步。';
          } else if (res.status === 401 || res.status === 403) {
            badge.className = "px-2 py-0.5 rounded-md text-[10px] font-bold bg-rose-100 text-rose-700";
            badge.innerText = "權限被拒 (401)";
            box.className = 'mt-2 p-2.5 rounded-xl text-[11px] leading-relaxed font-medium bg-rose-50 text-rose-800 border border-rose-200 block';
            box.innerHTML = '❌ <b>Permission Denied (HTTP 401)</b><br>請至 Firebase 控制台的 Realtime Database > Rules 將 <code>.read</code> 和 <code>.write</code> 設為 <code>true</code>。';
          }
        } catch (e) {
          badge.className = "px-2 py-0.5 rounded-md text-[10px] font-bold bg-rose-100 text-rose-700";
          badge.innerText = "網路錯誤";
          box.className = 'mt-2 p-2.5 rounded-xl text-[11px] leading-relaxed font-medium bg-rose-50 text-rose-800 border border-rose-200 block';
          box.innerHTML = '❌ <b>無法連線伺服器</b><br>請檢查網路，或網址是否正確。';
        }
        btn.innerHTML = '<i class="ph-bold ph-plugs-connected"></i><span>再次診斷</span>';
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
